.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
@keyframes scaleIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-box{background:#fff;border-radius:1.5rem;padding:2rem;max-width:560px;width:90%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,0.22);animation:scaleIn .22s cubic-bezier(.4,0,.2,1) forwards;}

input,select,textarea{transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#263F75 !important;box-shadow:0 0 0 3px rgba(38,63,117,0.12);}

/* ── Progress bars ───────────────────────────────────────── */
.progress-bar{height:6px;border-radius:3px;background:#e5e7eb;overflow:hidden;}

/* ── Animations ──────────────────────────────────────────── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeInUp .3s cubic-bezier(.4,0,.2,1) forwards;}

/* ── Misc ────────────────────────────────────────────────── */
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#e0e7ff;color:#3730a3;}

.announcement-card.urgent{border-left-color:#D12F43;}

@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main-content{margin-left:0;}
  .bottom-nav{display:flex !important;}
  .app-header{padding:10px 14px;}
  .header-menu-btn{display:flex !important;}
  .header-search{display:none;}
}
